name: Release

on:
  push:
    branches: [main]
    paths:
      - 'vellum/**'

jobs:
  release:
    runs-on: macos-latest
    if: "!contains(github.event.head_commit.message, 'Bump version')"
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' vellum.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')
          echo "current=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        run: |
          CURRENT="${{ steps.get_version.outputs.current }}"
          IFS='.' read -ra PARTS <<< "$CURRENT"
          NEW_VERSION="${PARTS[0]}.${PARTS[1]}.$((PARTS[2] + 1))"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          sed -i '' "s/MARKETING_VERSION = $CURRENT;/MARKETING_VERSION = $NEW_VERSION;/g" vellum.xcodeproj/project.pbxproj

      # --- NEW: without this the runner has no cert and xcodebuild falls back to ad-hoc ---
      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build and export (universal, Developer ID)
        run: |
          set -euo pipefail
          xcodebuild -scheme vellum -configuration Release \
            -archivePath build/Vellum.xcarchive \
            ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO \
            archive

          # NOTE: no "|| true" and no cp fallback. A signing failure must fail the
          # build rather than silently shipping an ad-hoc binary.
          xcodebuild -exportArchive \
            -archivePath build/Vellum.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

      - name: Verify signature before notarizing
        run: |
          set -euo pipefail
          APP=build/export/Vellum.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep "Authority=Developer ID Application"
          # Fail loudly if we somehow produced an ad-hoc binary again
          if codesign -dv "$APP" 2>&1 | grep -q "adhoc"; then
            echo "ERROR: app is ad-hoc signed"; exit 1
          fi
          lipo -info "$APP/Contents/MacOS/Vellum"

      # --- NEW: notarization was entirely absent before ---
      - name: Notarize and staple
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH=$RUNNER_TEMP/notary_key.p8
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode -o "$KEY_PATH"

          # ditto, not zip: preserves bundle structure and signature metadata
          ditto -c -k --keepParent build/export/Vellum.app "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait

          xcrun stapler staple build/export/Vellum.app
          xcrun stapler validate build/export/Vellum.app
          spctl -a -vvv -t exec build/export/Vellum.app

      - name: Create distribution zip
        id: zip
        run: |
          set -euo pipefail
          VERSION="${{ steps.bump_version.outputs.version }}"
          # Zip AFTER stapling so the release artifact carries the ticket
          ditto -c -k --keepParent build/export/Vellum.app "build/Vellum-${VERSION}.zip"
          echo "SHA256=$(shasum -a 256 "build/Vellum-${VERSION}.zip" | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vellum.xcodeproj/project.pbxproj
          git commit -m "Bump version to ${{ steps.bump_version.outputs.version }}"
          git push

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.bump_version.outputs.version }}
          name: Vellum ${{ steps.bump_version.outputs.version }}
          files: build/Vellum-${{ steps.bump_version.outputs.version }}.zip
          generate_release_notes: true

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not set, skipping homebrew update"
            exit 0
          fi

          git clone https://x-access-token:${TAP_TOKEN}@github.com/faisalmirza/homebrew-tap.git
          cd homebrew-tap

          cat > Casks/vellum-md.rb << EOF
          cask "vellum-md" do
            version "${{ steps.bump_version.outputs.version }}"
            sha256 "${{ steps.zip.outputs.SHA256 }}"

            url "https://github.com/faisalmirza/vellum/releases/download/v#{version}/Vellum-#{version}.zip"
            name "Vellum"
            desc "Fast markdown viewer for macOS"
            homepage "https://github.com/faisalmirza/vellum"

            depends_on macos: :ventura

            app "Vellum.app"

            zap trash: [
              "~/Library/Preferences/com.faisalmirza.vellum.plist",
              "~/Library/Saved Application State/com.faisalmirza.vellum.savedState",
            ]
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/vellum-md.rb
          git commit -m "Update vellum-md to ${{ steps.bump_version.outputs.version }}"
          git push
